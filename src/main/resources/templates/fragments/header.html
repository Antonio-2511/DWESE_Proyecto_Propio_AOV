<header th:fragment="header"
        class="border-bottom bg-light"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">

            <!-- Logo -->
            <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
                <span class="fw-semibold text-primary">
                    Proyecto Propio
                </span>
            </a>

            <!-- Botón responsive -->
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menú -->
            <div class="collapse navbar-collapse" id="navbarMenu">

                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">
                            Inicio
                        </a>
                    </li>

                    <!-- Visible solo para usuarios autenticados -->
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" th:href="@{/advertencias}">
                            Advertencias
                        </a>
                    </li>

                </ul>

                <!-- ===== USUARIO AUTENTICADO ===== -->
                <div class="d-none d-lg-flex align-items-center me-3"
                     sec:authorize="isAuthenticated()">

                    <span class="small text-secondary me-1">
                        Bienvenido,
                    </span>

                    <span class="small fw-semibold text-primary text-truncate"
                          style="max-width:220px"
                          sec:authentication="name">
                    </span>
                </div>

                <!-- ===== LOGIN (solo NO autenticado) ===== -->
                <div class="me-2" sec:authorize="!isAuthenticated()">
                    <a class="btn btn-outline-primary btn-sm"
                       th:href="@{/login}">
                        Login
                    </a>
                </div>

                <!-- ===== LOGOUT (solo autenticado) ===== -->
                <div class="me-2" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit"
                                class="btn btn-outline-danger btn-sm">
                            Cerrar sesión
                        </button>
                    </form>
                </div>

                <!-- Selector de idioma -->
                <form method="get" class="ms-2">
                    <select name="lang"
                            onchange="this.form.submit()"
                            class="form-select form-select-sm">
                        <option value="es"
                                th:selected="${#locale.language == 'es'}">
                            Español
                        </option>
                        <option value="en"
                                th:selected="${#locale.language == 'en'}">
                            English
                        </option>
                    </select>
                </form>

            </div>
        </div>
    </nav>
</header>
